<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oh My Leo</title>
  <meta name="description" content="Oh My Leo - Resmi web sitesi">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,Arial,sans-serif;
      min-height:100vh;
      color:#fff;
      background:radial-gradient(circle at 70% 20%,#273a78 0,#10162e 35%,#070a14 75%);
      overflow-x:hidden;
    }
    .glow{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
    .g1{background:#5d7cff;top:-100px;right:-80px}
    .g2{background:#9d4edd;bottom:-120px;left:-100px}
    nav{
      width:min(1100px,92%);margin:0 auto;padding:28px 0;
      display:flex;justify-content:space-between;align-items:center;
    }
    .logo{font-weight:800;font-size:24px;letter-spacing:-1px}
    .logo span{color:#7c91ff}
    nav a{color:#cbd3f7;text-decoration:none;font-size:14px}
    .hero{
      width:min(1100px,92%);min-height:75vh;margin:auto;
      display:flex;align-items:center;justify-content:center;text-align:center;
      position:relative;
    }
    .content{max-width:780px}
    .tag{
      display:inline-block;padding:8px 14px;border:1px solid #34416d;
      border-radius:999px;background:#ffffff08;color:#aebcff;font-size:13px;
      margin-bottom:22px;backdrop-filter:blur(10px)
    }
    h1{font-size:clamp(52px,10vw,100px);line-height:.95;letter-spacing:-5px}
    h1 span{color:#8fa1ff}
    p{margin:24px auto;max-width:600px;color:#b9c0da;font-size:18px;line-height:1.7}
    .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{
      padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:700;
      transition:.2s;display:inline-block
    }
    .primary{background:#fff;color:#0b1020}
    .secondary{border:1px solid #35416c;color:#fff;background:#ffffff08}
    .btn:hover{transform:translateY(-3px)}
    footer{text-align:center;color:#68708e;font-size:13px;padding:25px}
  </style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>

  <nav>
    <div class="logo">ohmy<span>leo</span>.</div>
    <a href="mailto:hello@ohmyleo.com.tr">İletişim</a>
  </nav>

  <main class="hero">
    <section class="content">
      <div class="tag">OH MY LEO · RESMİ SİTE</div>
      <h1>Welcome to<br><span>Oh My Leo.</span></h1>
      <p>Yeni nesil, sade ve güçlü bir dijital deneyim. Burası Oh My Leo'nun başlangıç noktası.</p>
      <div class="buttons">
        <a class="btn primary" href="mailto:hello@ohmyleo.com.tr">Bize Ulaş</a>
        <a class="btn secondary" href="#about">Keşfet</a>
      </div>
    </section>
  </main>

  <footer id="about">© 2026 Oh My Leo. Tüm hakları saklıdır.</footer>
</body>
</html>
